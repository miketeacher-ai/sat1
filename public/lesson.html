<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ders Detayı — SAT Reading Akademi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-colors">
        <span>← Tüm Derslere Dön</span>
      </a>
      <div id="headerLessonBadge" class="text-xs font-bold text-slate-400">
        Yükleniyor...
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full" id="mainContent">
    <div class="py-16 text-center text-slate-400">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-3"></div>
      <p>Ders içeriği yükleniyor...</p>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-sm text-slate-400 text-center">
    SAT Reading Akademi © 2026 — Entegre Ders & Soru Web Servisi
  </footer>

  <script src="/js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = urlParams.get('id') || '1A';

    async function loadLesson() {
      try {
        const lesson = await SATApp.fetchLesson(lessonId);
        renderLesson(lesson);
      } catch (err) {
        document.getElementById('mainContent').innerHTML = `
          <div class="p-8 bg-rose-50 border border-rose-200 rounded-2xl text-rose-800 text-center">
            <h2 class="text-lg font-bold">Ders Bulunamadı</h2>
            <p class="text-sm mt-1">${err.message}</p>
            <a href="/" class="inline-block mt-4 px-4 py-2 bg-rose-600 text-white rounded-xl text-sm font-semibold">Ana Sayfaya Dön</a>
          </div>
        `;
      }
    }

    function renderLesson(l) {
      document.title = `${l.id} - ${l.titleTR} | SAT Reading`;
      document.getElementById('headerLessonBadge').textContent = `${l.id} · ${l.categoryTR}`;

      const prog = SATApp.getLessonProgress(l.id);

      const html = `
        <!-- Lesson Header Card -->
        <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 mb-8 shadow-sm">
          <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
            <div class="flex items-center gap-3">
              <span class="text-4xl p-3 bg-slate-100 rounded-2xl">${l.icon}</span>
              <div>
                <div class="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">${l.id} · ${l.categoryTR}</div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${l.titleTR}</h1>
                <div class="text-sm text-slate-500 font-medium italic mt-0.5">${l.title}</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              ${SATApp.getDifficultyBadge(l.difficulty)}
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                Sınavda ≈${l.typicalCount} Soru
              </span>
            </div>
          </div>

          <p class="text-slate-700 text-base leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-200/80 mb-6">
            ${l.description}
          </p>

          <!-- Soru Kökü Sinyal Kelimeleri -->
          <div class="mb-6">
            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">🔍 Soru Kökünde Karşılaşacağınız İpuçları:</h4>
            <div class="flex flex-wrap gap-2">
              ${(l.signalPhrases || []).map(sp => `
                <span class="px-3 py-1 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-200/60 font-mono text-xs font-medium">
                  "${sp}"
                </span>
              `).join('')}
            </div>
          </div>

          <!-- Action bar -->
          <div class="flex flex-wrap items-center justify-between gap-4 pt-6 border-t border-slate-100">
            <div class="text-sm">
              ${prog ? `
                <span class="text-emerald-700 font-semibold bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200">
                  ✅ Bu dersi çözdünüz: %${prog.score} Doğruluk (${prog.correct}/${prog.total})
                </span>
              ` : `
                <span class="text-slate-500 text-xs">Henüz alıştırma çözülmedi (5 soru sizi bekliyor)</span>
              `}
            </div>

            <a href="/quiz?id=${l.id}" class="px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md shadow-indigo-200 transition-all inline-flex items-center gap-2">
              <span>🎯 Alıştırmalara Başla (5 Soru)</span>
              <span>→</span>
            </a>
          </div>
        </div>

        <!-- Mnemonic Framework (SCOPE, PAIR, etc.) -->
        ${l.framework ? `
          <div class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-3xl p-6 sm:p-8 mb-8 shadow-xl shadow-indigo-950/10">
            <div class="flex items-center justify-between mb-4">
              <div>
                <span class="text-xs uppercase font-bold text-indigo-400 tracking-wider">Hızlı Çözüm Çerçevesi</span>
                <h3 class="text-2xl font-extrabold tracking-tight">${l.framework.name} Yöntemi</h3>
              </div>
              <span class="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-mono font-bold border border-indigo-400/30">
                Formula
              </span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mt-6">
              ${l.framework.steps.map(s => `
                <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 backdrop-blur-sm">
                  <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white font-black text-lg flex items-center justify-center mb-2 shadow-sm">
                    ${s.letter}
                  </div>
                  <div class="font-bold text-indigo-300 text-sm mb-1">${s.word}</div>
                  <div class="text-slate-300 text-xs leading-relaxed">${s.action}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
          <!-- 5 Temel Beceri Haritası -->
          <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-7 shadow-sm">
            <h3 class="text-lg font-extrabold text-slate-900 mb-4 flex items-center gap-2">
              <span>🧠</span>
              <span>Usta Olmanız Gereken Beceriler</span>
            </h3>
            <ul class="space-y-3">
              ${(l.skills || []).map((sk, idx) => `
                <li class="flex items-start gap-3 text-sm text-slate-700">
                  <span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-50 text-indigo-700 font-bold text-xs flex items-center justify-center border border-indigo-200">
                    ${idx + 1}
                  </span>
                  <span>${sk}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          <!-- Yanlış Cevap Tuzakları -->
          <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-7 shadow-sm">
            <h3 class="text-lg font-extrabold text-rose-950 mb-4 flex items-center gap-2">
              <span>🚫</span>
              <span>College Board Tuzakları</span>
            </h3>
            <ul class="space-y-3">
              ${(l.wrongAnswerTraps || []).map(trap => `
                <li class="p-3 bg-rose-50/60 rounded-xl border border-rose-100 text-xs text-rose-900 leading-relaxed font-medium">
                  ⚠️ ${trap}
                </li>
              `).join('')}
            </ul>
          </div>
        </div>

        <!-- 3 Adım Adım Rehberli Alıştırma (Guided Exercises) -->
        ${(l.guidedExercises && l.guidedExercises.length > 0) ? `
          <div class="mb-10">
            <div class="flex items-center justify-between mb-4">
              <div>
                <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Uygulamalı Öğrenim</span>
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                  <span>📚</span>
                  <span>3 Adım Adım Rehberli Alıştırma (${l.framework ? l.framework.name : 'Strateji'} Uygulaması)</span>
                </h2>
              </div>
              <span class="text-xs px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 font-bold border border-indigo-200">
                Adım Adım Çözümlü
              </span>
            </div>
            <p class="text-sm text-slate-600 mb-6 leading-relaxed">
              Aşağıdaki 3 özgün alıştırmada, bu soru tipi için öğrendiğiniz <strong>${l.framework ? l.framework.name : ''}</strong> stratejisinin gerçek bir sınav sorusuna adım adım nasıl uygulandığını inceleyin:
            </p>

            <div class="space-y-6">
              ${l.guidedExercises.map((g, gIdx) => `
                <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden transition-all hover:border-indigo-300">
                  <!-- Exercise Top Header -->
                  <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                      <span class="w-7 h-7 rounded-xl bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">
                        ${gIdx + 1}
                      </span>
                      <h4 class="font-bold text-slate-900 text-sm sm:text-base">${g.title}</h4>
                    </div>
                    ${SATApp.getDifficultyBadge(g.difficulty)}
                  </div>

                  <div class="p-6">
                    <!-- Passage / Table / Notes Context -->
                    <div class="bg-slate-50/70 rounded-2xl border border-slate-200/80 p-5 mb-5 font-serif text-sm text-slate-800 leading-relaxed">
                      ${g.passage ? `<p>${g.passage}</p>` : ''}
                      ${g.tableData ? `
                        <div class="overflow-x-auto my-3 border border-slate-200 rounded-xl font-sans">
                          <table class="min-w-full text-xs text-left divide-y divide-slate-200">
                            <thead class="bg-slate-100 font-bold text-slate-700">
                              <tr>
                                ${g.tableData.headers.map(h => `<th class="px-3 py-2">${h}</th>`).join('')}
                              </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 bg-white">
                              ${g.tableData.rows.map(r => `
                                <tr>
                                  ${r.map(c => `<td class="px-3 py-2 font-mono">${c}</td>`).join('')}
                                </tr>
                              `).join('')}
                            </tbody>
                          </table>
                        </div>
                      ` : ''}
                      ${g.notes ? `
                        <div class="font-sans text-xs font-bold text-slate-500 mb-2">Öğrencinin Notları:</div>
                        <ul class="list-disc pl-5 space-y-1.5 font-sans text-xs text-slate-700">
                          ${g.notes.map(n => `<li>${n}</li>`).join('')}
                        </ul>
                        ${g.goal ? `
                          <div class="mt-3 p-2.5 bg-indigo-50 border border-indigo-200 rounded-xl font-sans text-xs text-indigo-900">
                            <strong>Öğrencinin Hedefi:</strong> ${g.goal}
                          </div>
                        ` : ''}
                      ` : ''}
                    </div>

                    <!-- Question Prompt -->
                    <h5 class="font-bold text-base text-slate-900 mb-4 leading-snug">
                      ${g.question}
                    </h5>

                    <!-- Choices Preview -->
                    <div class="grid grid-cols-1 gap-2.5 mb-6">
                      ${['A', 'B', 'C', 'D'].map(letter => `
                        <div class="p-3.5 rounded-xl border flex items-start gap-3 ${
                          letter === g.correctAnswer 
                            ? 'border-emerald-300 bg-emerald-50/40 text-emerald-950 font-medium' 
                            : 'border-slate-200 bg-white text-slate-700'
                        }">
                          <span class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs flex-shrink-0 ${
                            letter === g.correctAnswer 
                              ? 'bg-emerald-600 text-white' 
                              : 'bg-slate-100 text-slate-600'
                          }">
                            ${letter}
                          </span>
                          <span class="text-xs sm:text-sm pt-0.5">${g.choices[letter]}</span>
                          ${letter === g.correctAnswer ? '<span class="ml-auto text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">✓ Doğru</span>' : ''}
                        </div>
                      `).join('')}
                    </div>

                    <!-- Collapsible Strategy Walkthrough Steps -->
                    <div class="bg-gradient-to-br from-indigo-50/70 to-slate-50 rounded-2xl border border-indigo-100 p-5">
                      <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2 text-xs font-bold text-indigo-900 uppercase tracking-wider cursor-pointer" onclick="toggleWalkthrough('steps-${g.id}')">
                          <span>🔍</span>
                          <span>Adım Adım ${l.framework ? l.framework.name : 'Strateji'} Çözüm Süreci</span>
                        </div>
                        <div class="flex items-center gap-2">
                          <button onclick="toggleGuidedLang('${g.id}')" id="btn-glang-${g.id}" class="px-2.5 py-1 rounded-lg text-xs font-bold border border-indigo-200 bg-white text-indigo-700 hover:bg-indigo-50 transition-all flex items-center gap-1">
                            <span>🇬🇧 English Versiyon</span>
                          </button>
                          <span onclick="toggleWalkthrough('steps-${g.id}')" id="badge-${g.id}" class="cursor-pointer text-xs font-semibold text-indigo-600 hover:text-indigo-800">
                            Gizle / Göster ▾
                          </span>
                        </div>
                      </div>

                      <div id="steps-${g.id}" class="space-y-3 pt-2 border-t border-indigo-100/80">
                        <div id="steps-list-${g.id}" class="space-y-3">
                          ${g.strategySteps.map((st, sIdx) => `
                            <div class="flex items-start gap-3 bg-white p-3.5 rounded-xl border border-indigo-100/60 shadow-xs">
                              <span class="flex-shrink-0 px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-mono font-bold text-xs">
                                ${st.step}
                              </span>
                              <div class="text-xs text-slate-700 leading-relaxed pt-0.5">
                                ${st.detail}
                              </div>
                            </div>
                          `).join('')}
                        </div>

                        <div id="takeaway-${g.id}">
                          ${g.takeaway ? `
                            <div class="p-3.5 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-900 font-medium mt-2">
                              ${g.takeaway}
                            </div>
                          ` : ''}
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Altın Kurallar -->
        <div class="bg-amber-50 rounded-3xl border border-amber-200 p-6 sm:p-8 mb-8">
          <h3 class="text-lg font-extrabold text-amber-950 mb-3 flex items-center gap-2">
            <span>🔑</span>
            <span>Bu Soru Tipi İçin Altın Kurallar</span>
          </h3>
          <div class="space-y-2.5">
            ${(l.goldenRules || []).map(rule => `
              <div class="flex items-start gap-2.5 text-sm text-amber-900 font-medium">
                <span class="text-amber-500">✦</span>
                <span>${rule}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Next / Action footer -->
        <div class="text-center py-6">
          <a href="/quiz?id=${l.id}" class="inline-flex items-center gap-2 px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-lg shadow-indigo-200 transition-all hover:scale-[1.02]">
            <span>🚀 ${l.id} Soru Pratiğine Başla (5 Soru)</span>
          </a>
        </div>
      `;

      document.getElementById('mainContent').innerHTML = html;
      window.currentLessonData = l;
    }

    const guidedLangs = {}; // { '1A-G1': 'TR' }

    function toggleGuidedLang(exerciseId) {
      const l = window.currentLessonData;
      if (!l || !l.guidedExercises) return;
      const ex = l.guidedExercises.find(g => g.id === exerciseId);
      if (!ex) return;

      const current = guidedLangs[exerciseId] || 'TR';
      const nextLang = current === 'TR' ? 'EN' : 'TR';
      guidedLangs[exerciseId] = nextLang;

      const btn = document.getElementById(`btn-glang-${exerciseId}`);
      const listEl = document.getElementById(`steps-list-${exerciseId}`);
      const takeawayEl = document.getElementById(`takeaway-${exerciseId}`);

      const isEN = nextLang === 'EN';
      const steps = isEN && ex.strategyStepsEN ? ex.strategyStepsEN : ex.strategySteps;
      const takeaway = isEN && ex.takeawayEN ? ex.takeawayEN : ex.takeaway;

      if (btn) {
        btn.innerHTML = isEN ? '<span>🇹🇷 Türkçe Versiyon</span>' : '<span>🇬🇧 English Versiyon</span>';
        btn.className = isEN 
          ? 'px-2.5 py-1 rounded-lg text-xs font-bold border border-indigo-600 bg-indigo-600 text-white shadow-xs transition-all flex items-center gap-1'
          : 'px-2.5 py-1 rounded-lg text-xs font-bold border border-indigo-200 bg-white text-indigo-700 hover:bg-indigo-50 transition-all flex items-center gap-1';
      }

      if (listEl) {
        listEl.innerHTML = steps.map(st => `
          <div class="flex items-start gap-3 bg-white p-3.5 rounded-xl border border-indigo-100/60 shadow-xs">
            <span class="flex-shrink-0 px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-mono font-bold text-xs">
              ${st.step}
            </span>
            <div class="text-xs text-slate-700 leading-relaxed pt-0.5">
              ${st.detail}
            </div>
          </div>
        `).join('');
      }

      if (takeawayEl && takeaway) {
        takeawayEl.innerHTML = `
          <div class="p-3.5 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-900 font-medium mt-2">
            ${takeaway}
          </div>
        `;
      }
    }

    function toggleWalkthrough(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.toggle('hidden');
      }
    }

    loadLesson();
  </script>
</body>
</html>
