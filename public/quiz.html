<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT Alıştırma — Soru Çözümü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

  <!-- Top bar (Digital SAT Bluebook style) -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="text-xs font-semibold text-slate-500 hover:text-indigo-600">
          ← Çıkış
        </a>
        <div class="h-4 w-px bg-slate-300"></div>
        <span id="quizLessonTitle" class="text-xs font-bold text-slate-700">Ders Yükleniyor...</span>
      </div>

      <div class="flex items-center gap-4">
        <!-- Question Tracker -->
        <div class="flex items-center gap-1.5" id="questionPills"></div>

        <div class="h-4 w-px bg-slate-300"></div>

        <!-- Mode toggle -->
        <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-600">
          <input type="checkbox" id="instantFeedbackToggle" checked class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Anlık Geri Bildirim</span>
        </label>

        <!-- Flag Button -->
        <button onclick="openFlagModal()" class="text-xs px-2.5 py-1 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium">
          🚩 Soru Bildir
        </button>
      </div>
    </div>
  </header>

  <!-- Quiz Screen: 2 Column Desktop Layout -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col">
    <div id="quizContainer" class="flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Left Panel: Passage / Data (col-span-6 or 7) -->
      <div class="lg:col-span-6 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm overflow-y-auto max-h-[calc(100vh-140px)]" id="passagePanel">
        <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">METİN / VERİ</div>
        <div id="passageContent" class="text-slate-800 leading-relaxed text-sm sm:text-base space-y-4 font-serif">
          Yükleniyor...
        </div>
      </div>

      <!-- Right Panel: Question & Choices (col-span-6 or 5) -->
      <div class="lg:col-span-6 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between" id="questionPanel">
        <div>
          <div class="flex items-center justify-between gap-2 mb-3">
            <span id="questionNumberBadge" class="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200">
              Soru 1/5
            </span>
            <span id="questionDifficultyBadge"></span>
          </div>

          <h2 id="questionText" class="text-base sm:text-lg font-bold text-slate-900 mb-6 leading-snug">
            Soru metni yükleniyor...
          </h2>

          <!-- Choices Form -->
          <div class="space-y-3" id="choicesContainer"></div>

          <!-- Instant Feedback Area -->
          <div id="feedbackArea" class="hidden mt-6 pt-5 border-t border-slate-200"></div>
        </div>

        <!-- Action Footer -->
        <div class="flex items-center justify-between pt-6 mt-6 border-t border-slate-100">
          <button id="prevBtn" onclick="prevQuestion()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent">
            ← Önceki
          </button>
          
          <div class="flex items-center gap-2">
            <button id="nextBtn" onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition-colors">
              Sonraki Soru →
            </button>
            <button id="submitBtn" onclick="submitQuiz()" class="hidden px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-md shadow-indigo-200 transition-colors">
              Testi Bitir & Sonucu Gör 🏁
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Flag Question Modal -->
  <div id="flagModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-slate-900">🚩 Soru Kalite / Hata Bildirimi</h3>
        <button onclick="closeFlagModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>
      <p class="text-xs text-slate-500 mb-4">
        Bu soru veya açıklamasında bir hata, tutarsızlık veya öneriniz mi var? Doğruluk kontrol ekibine iletin.
      </p>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Gerekçe / Hata Tanımı:</label>
          <textarea id="flagReason" rows="3" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Örn: B seçeneği metindeki satırla çelişiyor..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Önerilen Düzeltme (İsteğe bağlı):</label>
          <input id="flagCorrection" type="text" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl" placeholder="Doğru açıklama metni...">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeFlagModal()" class="px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">İptal</button>
        <button onclick="submitFlag()" class="px-4 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700">Bildir</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = urlParams.get('id') || '1A';
    const isRandomMode = urlParams.get('random') === 'true';

    let quizData = null;
    let questions = [];
    let currentIndex = 0;
    let userAnswers = {}; // { '1A-Q1': 'B' }
    let instantFeedbackChecked = true;

    document.getElementById('instantFeedbackToggle').addEventListener('change', (e) => {
      instantFeedbackChecked = e.target.checked;
      renderFeedback();
    });

    async function initQuiz() {
      try {
        if (isRandomMode) {
          const res = await fetch('/api/quiz/mode/random?count=10');
          const data = await res.json();
          questions = data.questions;
          document.getElementById('quizLessonTitle').textContent = '🎲 Karışık Mini Deneme (10 Soru)';
        } else {
          quizData = await SATApp.fetchQuiz(lessonId);
          questions = quizData.questions;
          const lesson = await SATApp.fetchLesson(lessonId);
          document.getElementById('quizLessonTitle').textContent = `${lesson.id} · ${lesson.titleTR}`;
        }

        renderQuestionPills();
        showQuestion(0);
      } catch (err) {
        document.getElementById('quizContainer').innerHTML = `
          <div class="col-span-full p-8 bg-rose-50 border border-rose-200 rounded-2xl text-center text-rose-800">
            <h3 class="font-bold text-lg">Quiz yüklenemedi</h3>
            <p class="text-xs mt-1">${err.message}</p>
            <a href="/" class="inline-block mt-4 px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">Ana Sayfa</a>
          </div>
        `;
      }
    }

    function renderQuestionPills() {
      const container = document.getElementById('questionPills');
      container.innerHTML = questions.map((q, idx) => `
        <button onclick="showQuestion(${idx})" id="pill-${idx}" class="w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center transition-all ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${idx + 1}
        </button>
      `).join('');
    }

    function updatePills() {
      questions.forEach((q, idx) => {
        const pill = document.getElementById(`pill-${idx}`);
        if (!pill) return;
        const isAnswered = !!userAnswers[q.id];
        const isCurrent = idx === currentIndex;

        if (isCurrent) {
          pill.className = 'w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center ring-2 ring-indigo-600 bg-indigo-600 text-white';
        } else if (isAnswered) {
          pill.className = 'w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center bg-emerald-100 text-emerald-800 border border-emerald-300';
        } else {
          pill.className = 'w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-slate-200';
        }
      });
    }

    function showQuestion(idx) {
      if (idx < 0 || idx >= questions.length) return;
      currentIndex = idx;
      const q = questions[idx];

      // Update Header & Badge
      document.getElementById('questionNumberBadge').textContent = `Soru ${idx + 1}/${questions.length}`;
      document.getElementById('questionDifficultyBadge').innerHTML = SATApp.getDifficultyBadge(q.difficulty);
      document.getElementById('questionText').textContent = q.question;

      // Render Left Panel Content (Passage / Table / Notes)
      renderPassagePanel(q);

      // Render Choices
      renderChoices(q);

      // Render Feedback if answered
      renderFeedback();

      // Navigation Buttons
      document.getElementById('prevBtn').disabled = idx === 0;
      const isLast = idx === questions.length - 1;
      document.getElementById('nextBtn').classList.toggle('hidden', isLast);
      document.getElementById('submitBtn').classList.toggle('hidden', !isLast);

      updatePills();
    }

    function renderPassagePanel(q) {
      const panel = document.getElementById('passageContent');
      let html = '';

      if (q.isDoubleText) {
        const parts = q.passage.split('\n\nText 2:');
        html = `
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 mb-4">
            <div class="font-sans font-bold text-xs text-indigo-700 uppercase mb-1">Text 1</div>
            <p>${parts[0].replace('Text 1:', '').trim()}</p>
          </div>
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <div class="font-sans font-bold text-xs text-violet-700 uppercase mb-1">Text 2</div>
            <p>${(parts[1] || '').trim()}</p>
          </div>
        `;
      } else if (q.tableData) {
        html = `
          <p class="mb-4">${q.passage || ''}</p>
          <div class="overflow-x-auto my-4 border border-slate-200 rounded-xl">
            <table class="min-w-full text-xs font-sans text-left divide-y divide-slate-200">
              <thead class="bg-slate-100 font-bold text-slate-700">
                <tr>
                  ${q.tableData.headers.map(h => `<th class="px-3 py-2">${h}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 bg-white">
                ${q.tableData.rows.map(r => `
                  <tr>
                    ${r.map(cell => `<td class="px-3 py-2 font-mono text-slate-800">${cell}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (q.notes) {
        html = `
          <div class="mb-3 text-xs font-sans font-semibold text-slate-500">Öğrencinin Araştırma Notları:</div>
          <ul class="list-disc pl-5 space-y-2 text-sm">
            ${q.notes.map(n => `<li>${n}</li>`).join('')}
          </ul>
          ${q.goal ? `
            <div class="mt-4 p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-xs font-sans text-indigo-900">
              <strong>Öğrencinin Hedefi:</strong> ${q.goal}
            </div>
          ` : ''}
        `;
      } else {
        html = `<p class="leading-relaxed">${q.passage}</p>`;
      }

      panel.innerHTML = html;
    }

    function renderChoices(q) {
      const container = document.getElementById('choicesContainer');
      const selected = userAnswers[q.id];

      container.innerHTML = ['A', 'B', 'C', 'D'].map(letter => {
        const text = q.choices[letter];
        const isSelected = selected === letter;

        return `
          <button onclick="selectChoice('${letter}')" class="w-full text-left p-4 rounded-xl border transition-all flex items-start gap-3 group ${
            isSelected 
              ? 'border-indigo-600 bg-indigo-50/50 shadow-xs' 
              : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 bg-white'
          }">
            <span class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs flex-shrink-0 transition-colors ${
              isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 group-hover:bg-slate-200'
            }">
              ${letter}
            </span>
            <span class="text-xs sm:text-sm text-slate-800 font-medium pt-0.5 leading-snug">
              ${text}
            </span>
          </button>
        `;
      }).join('');
    }

    function selectChoice(letter) {
      const q = questions[currentIndex];
      userAnswers[q.id] = letter;
      renderChoices(q);
      updatePills();
      renderFeedback();
    }

    let currentFeedbackLang = 'TR'; // 'TR' or 'EN'
    let currentFeedbackItem = null;

    async function renderFeedback() {
      const area = document.getElementById('feedbackArea');
      const q = questions[currentIndex];
      const selected = userAnswers[q.id];

      if (!instantFeedbackChecked || !selected) {
        area.classList.add('hidden');
        currentFeedbackItem = null;
        return;
      }

      area.classList.remove('hidden');

      // Test submit on single question to retrieve verified explanation & trap breakdown
      try {
        const result = await SATApp.submitQuiz(q.lessonId || (isRandomMode ? 'RANDOM' : lessonId), { [q.id]: selected });
        const item = result.results.find(r => r.questionId === q.id);

        if (!item) return;
        currentFeedbackItem = item;
        updateFeedbackCard();
      } catch (e) {
        console.error(e);
      }
    }

    function toggleFeedbackLang() {
      currentFeedbackLang = currentFeedbackLang === 'TR' ? 'EN' : 'TR';
      updateFeedbackCard();
    }

    function updateFeedbackCard() {
      const area = document.getElementById('feedbackArea');
      const item = currentFeedbackItem;
      const q = questions[currentIndex];
      const selected = userAnswers[q.id];
      if (!item) return;

      const isEN = currentFeedbackLang === 'EN';
      const explanationText = isEN ? (item.explanationEN || item.explanation) : item.explanation;
      const trapText = isEN ? (item.trapExplanationEN || item.trapExplanation) : item.trapExplanation;

      const titleText = isEN 
        ? (item.isCorrect ? '✅ Excellent, Correct Answer!' : `❌ Incorrect — Correct Answer: ${item.correctAnswer}`)
        : (item.isCorrect ? '✅ Tebrikler, Doğru Cevap!' : `❌ Yanlış — Doğru Cevap: ${item.correctAnswer}`);

      const trapHeading = isEN ? `⚠️ Trap Analysis (${selected}):` : `⚠️ Tuzak Analizi (${selected}):`;
      const btnLabel = isEN ? '🇹🇷 Türkçe Açıklama' : '🇬🇧 English Version';

      area.innerHTML = `
        <div class="rounded-2xl p-4 border ${item.isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}">
          <div class="flex items-center justify-between gap-2 font-extrabold text-sm mb-2">
            <span>${titleText}</span>
            <button onclick="toggleFeedbackLang()" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
              isEN 
                ? 'bg-indigo-600 text-white shadow-xs' 
                : 'bg-white text-indigo-700 border border-indigo-200 hover:bg-indigo-50'
            }">
              ${btnLabel}
            </button>
          </div>
          
          <p class="text-xs leading-relaxed mb-3">
            ${explanationText}
          </p>

          ${trapText ? `
            <div class="p-2.5 bg-white/90 rounded-xl border border-rose-300/60 text-xs text-rose-950">
              <span class="font-bold">${trapHeading}</span> ${trapText}
            </div>
          ` : ''}
        </div>
      `;
    }

    function prevQuestion() {
      if (currentIndex > 0) showQuestion(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
    }

    async function submitQuiz() {
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < questions.length) {
        if (!confirm(`${questions.length} sorudan sadece ${answeredCount} tanesini yanıtladınız. Testi bitirmek istediğinize emin misiniz?`)) {
          return;
        }
      }

      try {
        const targetLessonId = isRandomMode ? 'RANDOM' : lessonId;
        const result = await SATApp.submitQuiz(targetLessonId, userAnswers);

        // Save progress in localStorage if not random
        if (!isRandomMode) {
          SATApp.saveQuizResult(targetLessonId, result);
        }

        // Store result in sessionStorage for results page
        sessionStorage.setItem('lastQuizResult', JSON.stringify(result));
        window.location.href = `/results?id=${targetLessonId}`;
      } catch (err) {
        alert('Test gönderilirken hata oluştu: ' + err.message);
      }
    }

    // Flag Modal Functions
    function openFlagModal() {
      document.getElementById('flagModal').classList.remove('hidden');
    }
    function closeFlagModal() {
      document.getElementById('flagModal').classList.add('hidden');
      document.getElementById('flagReason').value = '';
      document.getElementById('flagCorrection').value = '';
    }
    async function submitFlag() {
      const q = questions[currentIndex];
      const reason = document.getElementById('flagReason').value.trim();
      const correction = document.getElementById('flagCorrection').value.trim();

      if (reason.length < 5) {
        alert('Lütfen en az 5 karakterlik bir gerekçe girin.');
        return;
      }

      try {
        const res = await SATApp.flagQuestion(q.id, reason, correction);
        alert(res.message);
        closeFlagModal();
      } catch (err) {
        alert('Bildirim iletilemedi: ' + err.message);
      }
    }

    initQuiz();
  </script>
</body>
</html>
